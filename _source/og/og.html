<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;font-family:Manrope,sans-serif;color:#C3CDE4;overflow:hidden;
background:radial-gradient(700px 420px at 92% 0%,rgba(37,99,235,.5),transparent 60%),radial-gradient(600px 380px at 0% 100%,rgba(201,162,39,.22),transparent 60%),linear-gradient(180deg,#050D20,#0B1B3F);}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(ellipse at 75% 30%,#000 20%,transparent 75%)}
.wrap{position:relative;padding:64px 72px;height:100%;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;color:#fff}
.brand b{font-family:Fraunces,serif;font-size:28px;font-weight:600;display:block}
.brand small{color:#E3C766;font-size:13px;letter-spacing:.22em;font-weight:800;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:12px;margin-top:54px;padding:10px 20px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#E5EAF5;font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase;align-self:flex-start}
.chip i{width:12px;height:12px;border-radius:50%;background:#34D399;box-shadow:0 0 0 6px rgba(52,211,153,.2)}
h1{font-family:Fraunces,serif;color:#fff;font-weight:600;font-size:76px;line-height:1.04;letter-spacing:-.02em;margin-top:26px;max-width:860px}
h1 em{color:#E3C766;font-weight:500}
p{font-size:28px;margin-top:22px;font-weight:600}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.btn{background:linear-gradient(135deg,#E3C766,#C9A227);color:#050D20;font-weight:800;font-size:24px;padding:18px 34px;border-radius:99px}
.url{font-size:22px;font-weight:700;color:#93A2C5}
.cal{position:absolute;right:80px;top:150px;width:210px;border-radius:26px;overflow:hidden;background:#fff;text-align:center;transform:rotate(5deg);box-shadow:0 40px 70px -20px rgba(0,0,0,.6)}
.cal span{display:block;background:linear-gradient(135deg,#E3C766,#C9A227);color:#050D20;font-weight:800;letter-spacing:.22em;font-size:16px;padding:12px;text-transform:uppercase}
.cal b{display:block;font-family:Fraunces,serif;font-size:72px;color:#0B1B3F;padding-top:12px;line-height:1.1}
.cal em{display:block;font-style:normal;font-weight:800;color:#2563EB;font-size:20px;padding:4px 0 22px}
</style></head><body><div class="grid"></div><div class="wrap">
<div class="brand"><svg width="52" height="52" viewBox="0 0 40 40"><rect width="40" height="40" rx="11" fill="#142B5E"/><rect x="9" y="22" width="5.5" height="9" rx="1.6" fill="#5B8CFF"/><rect x="17.25" y="15" width="5.5" height="16" rx="1.6" fill="#BFD0FF"/><rect x="25.5" y="8.5" width="5.5" height="22.5" rx="1.6" fill="#C9A227"/></svg><div><b>Intelligence With Data</b><small>Strategy and Mastery</small></div></div>
<div id="content"></div>
</div></body></html>
